<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe Game</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
</head>

<body>
    <div class="container" role="main" aria-label="Tic Tac Toe Game">
        <div id="home-screen" class="home-screen" role="region" aria-labelledby="home-heading">
            <h1 id="home-heading">Welcome to Tic-Tac-Toe</h1>
            <div class="customization">
                <div class="game-mode-selection">
                    <label for="game-mode">Game Mode:</label>
                    <select id="game-mode">
                        <option value="pvc" selected>Player vs Computer</option>
                        <option value="pvp">Player vs Player</option>
                    </select>
                </div>
                <div class="player-selection">
                    <div class="symbol-selection">
                        <label for="player1-symbol">Player 1 Symbol:</label>
                        <select id="player1-symbol">
                            <option value="X">X</option>
                            <option value="O">O</option>
                        </select>
                    </div>
                    <div class="color-selection">
                        <label for="player1-color">Player 1 Color:</label>
                        <input type="color" id="player1-color" value="#B22222">
                    </div>
                </div>

                <div class="player-selection">
                    <div class="symbol-selection">
                        <label for="player2-symbol">Player 2 Symbol:</label>
                        <select id="player2-symbol">
                            <option value="O">O</option>
                            <option value="X">X</option>
                        </select>
                    </div>
                    <div class="color-selection">
                        <label for="player2-color">Player 2 Color:</label>
                        <input type="color" id="player2-color" value="#b26a22">
                    </div>
                </div>

                <button id="start-game">Start Game</button>
            </div>
        </div>

        <div id="game-screen" class="game-screen" role="region" aria-labelledby="game-heading" style="display: none;">
            <h2 id="game-heading" class="sr-only">Game Screen</h2>
            <div class="tools" role="toolbar" aria-label="Game Controls">
                <div class="symbols">
                    <span class="material-symbols-outlined" id="player1-symbol-display">close</span>
                    <span class="material-symbols-outlined" id="player2-symbol-display">circle</span>
                </div>
                <div class="reset">
                    <button class="button" aria-label="Reset Game">
                        <span class="material-symbols-outlined">refresh</span>
                    </button>
                </div>
                <div class="difficulty-selection">
                    <label for="difficulty">Choose Difficulty:</label>
                    <select id="difficulty" name="difficulty">
                        <option value="easy">Easy</option>
                        <option value="medium">Medium</option>
                        <option value="hard" selected>Hard</option>
                    </select>
                </div>
                <div class="back-to-home">
                    <button id="back-home-button">Back to Home</button>
                </div>
            </div>

            <section class="game-board" role="grid" aria-label="Tic Tac Toe Board">
                <table role="presentation" aria-describedby="board-description">
                    <caption id="board-description" class="sr-only">
                        Use arrow keys or tab to move between cells and enter to make a move.
                    </caption>
                    <tr>
                        <td><button class="cell" id="0" aria-label="Cell 1"></button></td>
                        <td><button class="cell" id="1" aria-label="Cell 2"></button></td>
                        <td><button class="cell" id="2" aria-label="Cell 3"></button></td>
                    </tr>
                    <tr>
                        <td><button class="cell" id="3" aria-label="Cell 4"></button></td>
                        <td><button class="cell" id="4" aria-label="Cell 5"></button></td>
                        <td><button class="cell" id="5" aria-label="Cell 6"></button></td>
                    </tr>
                    <tr>
                        <td><button class="cell" id="6" aria-label="Cell 7"></button></td>
                        <td><button class="cell" id="7" aria-label="Cell 8"></button></td>
                        <td><button class="cell" id="8" aria-label="Cell 9"></button></td>
                    </tr>
                </table>
            </section>

            <aside class="stats">
                <div class="player">
                    <label>Player 1: </label>
                    <span class="score1">0</span>
                </div>
                <div class="draws">
                    <label>Draws: </label>
                    <span class="draw">0</span>
                </div>
                <div class="player">
                    <label>Player 2: </label>
                    <span class="score2">0</span>
                </div>
            </aside>
        </div>
    </div>

    <div class="endgame" role="alert">
        <div class="message">
            <div id="close" onclick="closeEndgameMessage()">
                <span class="material-symbols-outlined">close</span>
            </div>
            <div class="content">
                <div class="result-message" aria-live="assertive">
                    <span class="message-text" aria-live="assertive"></span>
                    <div class="winner-announcement">
                        The winner is <span class="winner-symbol"></span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <audio id="move-sound" src="sounds/Player-Moves.mp3"></audio>
    <audio id="win-sound" src="sounds/Winning-Game.mp3"></audio>
    <audio id="tie-sound" src="sounds/Tie-Game.mp3"></audio>
</body>

</html>
